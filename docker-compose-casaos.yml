name: krakenbridge-web
services:
  krakenbridge-web:
    command:
      - sh
      - -c
      - mkdir -p /root/.config/com.vercel.cli /root/.local/share && ln -sf /root/.config/com.vercel.cli /root/.local/share/com.vercel.cli && ln -sf /app/bin/agy /usr/local/bin/agy && ln -sf /app/bin/gh /usr/local/bin/gh && ln -sf /app/bin/vercel /usr/local/bin/vercel && ln -sf /app/bin/vc /usr/local/bin/vc && ln -sf /app/bin/ai-memory /usr/local/bin/ai-memory && mkdir -p /root/.local/lib/ai-memory && ln -sf /app/bin/ai-memory /root/.local/lib/ai-memory/ai-memory && npm install && node server.js
    container_name: krakenbridge-web
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M
    environment:
      CODE_SERVER_PORT: "8089"
      KRAKEN_PIN: "050523"
      NODE_ENV: production
      PORT: "8088"
      TZ: America/Sao_Paulo
      WORKSPACE_DIR: /workspace
      COUCOU_HOST: "192.168.31.60"
      COUCOU_PORT: "47821"
    image: node:22
    labels:
      icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kraken.png
      io.zimaos.app.id: zimaapp://v2app/krakenbridge-web
    networks:
      default: null
    ports:
      - target: 8088
        published: "8088"
        protocol: tcp
      - target: 47821
        published: "47821"
        protocol: tcp
    pull_policy: never
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/dev-workspace
        target: /app
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/Projetos
        target: /workspace
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/.ssh
        target: /root/.ssh
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/.gemini
        target: /root/.gemini
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/dev-workspace/.config
        target: /root/.config
      - type: bind
        source: /var/lib/casaos
        target: /var/lib/casaos
      - type: bind
        source: /DATA
        target: /DATA
      - type: bind
        source: /usr/lib/docker/cli-plugins
        target: /usr/lib/docker/cli-plugins
      - type: bind
        source: /usr/bin/docker
        target: /usr/bin/docker
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: true
    working_dir: /app
networks:
  default:
    name: krakenbridge-web_default
x-casaos:
  architectures:
    - amd64
    - arm64
  author: KrakenBridge Community
  category: Development
  description:
    en_US: 'KrakenBridge Web: Autonomous Multi-Agent AI Bridge & Integrated VS Code for ZimaOS and Docker. Run coding agents with real-time terminal logs and instant code diffs in your homelab.'
    pt_BR: 'KrakenBridge Web: Ponte Multi-Agente com IA Aut?noma e VS Code Integrado para ZimaOS e Docker. Execute agentes com logs de terminal em tempo real e diffs instant?neos no seu homelab.'
  developer: KrakenBridge Community
  hostname: gabisa.apenasgabs.dev
  icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kraken.png
  id: com.krakenbridge.web
  index: /chat/
  is_uncontrolled: false
  main: krakenbridge-web
  port_map: ""
  scheme: https
  store_app_id: krakenbridge-web
  tagline:
    en_US: Multi-Agent Autonomous AI Bridge & Web IDE
    pt_BR: Ponte Multi-Agente com IA Aut?noma e Web IDE
  thumbnail: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kraken.png
  title:
    custom: KrakenBridge Web
    en_US: KrakenBridge Studio
    pt_BR: KrakenBridge Web
