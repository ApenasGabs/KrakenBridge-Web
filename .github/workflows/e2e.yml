name: E2E Visual Tests (Playwright CI Gate)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    name: Playwright E2E & Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Playwright E2E & Visual Regression Tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
