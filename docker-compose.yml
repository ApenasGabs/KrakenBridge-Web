name: krakenbridge-web
services:
  # ========================================================
  # 1. KrakenBridge Web (Agente Autônomo com Logs de Terminal)
  # ========================================================
  krakenbridge-web:
    container_name: krakenbridge-web
    build:
      context: .
      dockerfile: Dockerfile
    image: krakenbridge-web:latest
    restart: unless-stopped
    ports:
      - target: 8088
        published: "${WEB_PORT:-8088}"
        protocol: tcp
    environment:
      - PORT=8088
      - WORKSPACE_DIR=/workspace
      - CODE_SERVER_PORT=${IDE_PORT:-8089}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NODE_ENV=production
    volumes:
      - "${WORKSPACE_PATH:-/DATA/Projetos}:/workspace"
      - "${KRAKEN_CONFIG_PATH:-/DATA/AppData/krakenbridge/config}:/root/.gemini"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    x-casaos:
      envs:
        - container: GEMINI_API_KEY
          description:
            en_US: Google Gemini API Key (for Antigravity)
            pt_BR: Chave de API Google Gemini (para Antigravity)
        - container: ANTHROPIC_API_KEY
          description:
            en_US: Anthropic API Key (for Claude Code)
            pt_BR: Chave de API Anthropic (para Claude Code)
        - container: OPENAI_API_KEY
          description:
            en_US: OpenAI API Key (for Codex / Aider)
            pt_BR: Chave de API OpenAI (para Codex / Aider)
      volumes:
        - container: /workspace
          description:
            en_US: Directory with your code repositories
            pt_BR: Diretório onde ficam seus repositórios de código
        - container: /root/.gemini
          description:
            en_US: Persistent CLI credentials and history
            pt_BR: Credenciais persistentes e histórico do CLI
      ports:
        - container: "8088"
          description:
            en_US: KrakenBridge Web UI Port
            pt_BR: Porta da Interface Web do KrakenBridge

  # ========================================================
  # 2. VS Code Web (code-server Integrado no mesmo Workspace)
  # ========================================================
  code-server:
    container_name: code-server
    image: linuxserver/code-server:latest
    restart: unless-stopped
    ports:
      - target: 8443
        published: "${IDE_PORT:-8089}"
        protocol: tcp
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Sao_Paulo}
      - PASSWORD=${IDE_PASSWORD:-} # Deixe vazio para dispensar senha na rede local
      - SUDO_PASSWORD=${IDE_SUDO_PASSWORD:-password}
      - DEFAULT_WORKSPACE=/workspace
    volumes:
      - "${WORKSPACE_PATH:-/DATA/Projetos}:/workspace"
      - "${CODE_SERVER_CONFIG:-/DATA/AppData/code-server-config}:/config"
    x-casaos:
      volumes:
        - container: /workspace
          description:
            en_US: Shared code workspace
            pt_BR: Workspace de código compartilhado
        - container: /config
          description:
            en_US: code-server configuration and extensions
            pt_BR: Configurações e extensões do code-server
      ports:
        - container: "8443"
          description:
            en_US: VS Code Web Port
            pt_BR: Porta do VS Code Web

# ========================================================
# Metadados de Integração ZimaOS / CasaOS App Store
# ========================================================
x-casaos:
  architectures:
    - amd64
    - arm64
  main: krakenbridge-web
  author: KrakenBridge Community
  category: Development
  description:
    en_US: "KrakenBridge Web: Autonomous Multi-Agent AI Bridge & Integrated VS Code for ZimaOS and Docker. Run coding agents with real-time terminal logs and instant code diffs in your homelab."
    pt_BR: "KrakenBridge Web: Ponte Multi-Agente com IA Autônoma e VS Code Integrado para ZimaOS e Docker. Execute agentes com logs de terminal em tempo real e diffs instantâneos no seu homelab."
  developer: KrakenBridge Community
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/google-gemini.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/google-gemini.png
  title:
    en_US: KrakenBridge Web
    pt_BR: KrakenBridge Web
  index: /
  port_map: "8088"
  scheme: http
