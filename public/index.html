<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KrakenBridge Web - Multi-Agent Studio</title>
  
  <!-- Estilos e Bibliotecas -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-[#0f1115] text-[#e6e8ec] select-none">

  <!-- Header Superior Modular -->
  <header id="app-header"></header>

  <!-- Corpo Principal: Sidebar + Visualizadores -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- Sidebar de Histórico de Conversas -->
    <aside id="app-sidebar"></aside>

    <!-- Área de Trabalho Central -->
    <div class="flex-1 flex flex-col overflow-hidden relative bg-[#0f1115]">
      
      <!-- Barra de Opções de Terminal / CLI -->
      <div id="app-options-bar"></div>

      <!-- Visualizador 1: Chat com o Agente -->
      <main id="view-chat" class="flex-1 flex flex-col overflow-hidden relative"></main>

      <!-- Visualizador 2: IDE Integrada (VS Code / code-server) -->
      <section id="view-ide" class="flex-1 hidden flex-col overflow-hidden">
        <iframe
          id="ide-frame"
          src="about:blank"
          class="w-full h-full border-none bg-[#1e1e1e]"
          allow="clipboard-read; clipboard-write;"
        ></iframe>
      </section>
    </div>
  </div>

  <!-- Modal de Autenticação -->
  <div id="modal-auth" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"></div>

  <!-- Script Modular ES Modules -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
